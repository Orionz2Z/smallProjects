<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青疯协社</title>
    <style>
        /* 重置默认样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            list-style: none;
        }

        /* 轮播整体容器 */
        .carousel {
            position: relative;
            max-width: 800px;
            /* 优化：不再固定高度，改为根据图片比例自适应，或固定合理比例避免图片拆分 */
            height: auto;
            max-height: 500px;
            margin: 50px auto;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        /* 图片列表容器（实现水平排列和平滑切换）
           修复核心：去掉硬编码的宽度calc(100% * 5)，由flex布局自动撑开，适配图片数量 */
        .carousel-img-list {
            position: absolute;
            top: 0;
            left: 0;
            width: auto; /* 关键修改：移除硬编码宽度，动态适配图片数量 */
            height: 100%;
            display: flex;
            transition: transform 0.5s ease-in-out; /* 平滑切换过渡动画 */
        }

        /* 单张图片样式 */
        .carousel-img-item {
            width: 100%;
            height: 100%;
            flex: 1 0 100%; /* 强制每个图片项占满容器宽度，保证单张图片完整显示 */
        }

        .carousel-img-item img {
            width: 100%;
            height: 100%;
            /* 关键优化：提供两种图片完整显示方案，按需选择 */
            /* 方案1：contain - 完整显示图片，不裁剪，可能留边（优先保证图片完整性） */
            object-fit: contain;
            /* 方案2：cover - 填充容器，裁剪边缘（如需铺满容器，保留此属性，需保证图片与容器比例匹配） */
            /* object-fit: cover; */
            background-color: #f5f5f5; /* 配合contain，留边时显示浅背景，更美观 */
        }

        /* 左右切换按钮 */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            background-color: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 50%;
            font-size: 18px;
            color: #333;
            cursor: pointer;
            z-index: 10; /* 确保按钮在图片上方 */
            transition: all 0.3s ease;
        }

        .carousel-btn:hover {
            background-color: #ffffff;
            transform: translateY(-50%) scale(1.05);
        }

        .prev-btn {
            left: 20px;
        }

        .next-btn {
            right: 20px;
        }

        /* 底部指示器（小圆点） */
        .carousel-indicators {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .indicator-item {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .indicator-item.active {
            background-color: #ffffff;
            width: 28px;
            border-radius: 5px; /* 激活状态变为椭圆，更醒目 */
        }

        /* 响应式适配（移动端适配） */
        @media (max-width: 768px) {
            .carousel {
                max-width: 100%;
                max-height: 300px;
                margin: 20px auto;
                border-radius: 8px;
            }

            .carousel-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }

            .indicator-item {
                width: 8px;
                height: 8px;
            }

            .indicator-item.active {
                width: 24px;
            }
			
        }
    </style>
</head>
<body>
	<div>
		<div style="margin: 0; width: 100vw; height: 100px; display: flex; justify-content: center; align-items: center; " >
			<h1>青年先疯协会合作交流部</h1>
		</div>
		<!-- 轮播组件核心结构 -->
    <div class="carousel" id="carousel">
        <!-- 图片列表 -->
        <ul class="carousel-img-list" id="imgList">
            <li class="carousel-img-item">
                <img src="img/shihengyu18.jpg" alt="轮播图片1">
            </li>
            <li class="carousel-img-item">
                <img src="img/yuandhe.jpg" alt="轮播图片2">
            </li>
        </ul>

        <!-- 左右切换按钮 -->
        <button class="carousel-btn prev-btn" id="prevBtn">◀</button>
        <button class="carousel-btn next-btn" id="nextBtn">▶</button>

        <!-- 底部指示器 -->
        <div class="carousel-indicators" id="indicators">
            <span class="indicator-item active" data-index="0"></span>
            <span class="indicator-item" data-index="1"></span>
        </div>
		
		<div>
			
		</div>
    </div>
	</div>
    

    <script>
        // 1. 获取DOM元素
        const carousel = document.getElementById('carousel');
        const imgList = document.getElementById('imgList');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const indicators = document.getElementById('indicators').querySelectorAll('.indicator-item');
        
        // 2. 定义核心变量
        const imgCount = indicators.length; // 图片总数（与指示器数量一致）
        let currentIndex = 0; // 当前轮播索引（默认显示第一张）
        let autoPlayTimer = null; // 自动轮播定时器
        let imgWidth = carousel.offsetWidth; // 单张图片宽度（等于轮播容器宽度）

        // 关键补充：初始化轮播容器高度，匹配图片高度，避免图片拆分
        function initCarouselHeight() {
            const firstImg = document.querySelector('.carousel-img-item img');
            if (firstImg) {
                // 等待图片加载完成后设置容器高度
                firstImg.onload = function() {
                    carousel.style.height = `${firstImg.naturalHeight * (imgWidth / firstImg.naturalWidth)}px`;
                    imgList.style.height = `${carousel.offsetHeight}px`;
                }
                // 若图片已缓存，直接触发高度计算
                if (firstImg.complete) {
                    carousel.style.height = `${firstImg.naturalHeight * (imgWidth / firstImg.naturalWidth)}px`;
                    imgList.style.height = `${carousel.offsetHeight}px`;
                }
            }
        }

        // 3. 核心函数：切换到指定索引的图片
        function goToIndex(index) {
            // 边界判断：防止索引越界（循环轮播）
            if (index < 0) {
                currentIndex = imgCount - 1;
            } else if (index >= imgCount) {
                currentIndex = 0;
            } else {
                currentIndex = index;
            }

            // 移动图片列表（实现切换）
            imgList.style.transform = `translateX(-${currentIndex * imgWidth}px)`;

            // 更新指示器激活状态
            updateIndicators();
        }

        // 4. 辅助函数：更新指示器样式
        function updateIndicators() {
            indicators.forEach((item, index) => {
                if (index === currentIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // 5. 辅助函数：启动自动轮播（每隔3秒切换下一张）
        function startAutoPlay() {
            autoPlayTimer = setInterval(() => {
                goToIndex(currentIndex + 1);
            }, 3000);
        }

        // 6. 辅助函数：停止自动轮播
        function stopAutoPlay() {
            clearInterval(autoPlayTimer);
        }

        // 7. 绑定事件监听
        // 左按钮点击：切换上一张
        prevBtn.addEventListener('click', () => {
            goToIndex(currentIndex - 1);
        });

        // 右按钮点击：切换下一张
        nextBtn.addEventListener('click', () => {
            goToIndex(currentIndex + 1);
        });

        // 指示器点击：切换到对应索引的图片
        indicators.forEach((item) => {
            item.addEventListener('click', () => {
                const targetIndex = parseInt(item.dataset.index);
                goToIndex(targetIndex);
            });
        });

        // 鼠标悬停轮播容器：暂停自动轮播
        carousel.addEventListener('mouseenter', stopAutoPlay);

        // 鼠标离开轮播容器：重启自动轮播
        carousel.addEventListener('mouseleave', startAutoPlay);

        // 窗口大小变化：更新图片宽度和容器高度，防止切换错位、图片拆分
        window.addEventListener('resize', () => {
            imgWidth = carousel.offsetWidth;
            // 重新计算容器高度
            initCarouselHeight();
            // 重新定位当前图片
            imgList.style.transform = `translateX(-${currentIndex * imgWidth}px)`;
        });

        // 8. 初始化：启动自动轮播 + 初始化容器高度
        initCarouselHeight();
        startAutoPlay();
    </script>
</body>
</html>
